<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bucin Mode</title>
    <style>
        body {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            margin-top: 100px;
        }

        .box {
            background: rgba(255,255,255,0.2);
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(10px);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #ff1e4d;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Tôi có một món quà dành cho bạn.</h1>
        <p id="text">bấm vào đây...</p>
        <button onclick="bucin()">bấm vào tôi 😳</button>
    </div>

    <script>
        function bucin() {
            const kata = [
                "Anh Yêu Em❤️",
                "Bạn rất đặc biệt đối với tôi 😳",
                "Tôi không thể xa bạn được. 🌸",
                "Đừng rời xa tôi 🥺",
                "Anh yêu em rất nhiều, vợ yêu của anh. 💘"
            ];

            let random = Math.floor(Math.random() * kata.length);
            document.getElementById("text").innerText = kata[random];
        }
    </script>

</body>
</html>
